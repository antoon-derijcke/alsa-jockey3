# Global kernel-message classification rules.
#
# Per-case expectations live in catalog.yaml under `expect_dmesg`; this file
# holds what is true regardless of which case is running.
#
# The important thing this file encodes: "no warnings" is NOT a pass criterion
# for this driver. Capture stall after a rate change is expected on a healthy
# build, and the driver logs it deliberately on every occurrence so that stall
# frequency can be tracked. A rule set that failed on warnings would fail every
# run on a perfectly good driver.

version: 1

# Messages from our driver that are normal anywhere. Counted and reported as
# metrics, never failures.
benign:
  - pattern: 'Playback URB has stalled\.'
    metric: stalls_playback
    why: >
      Logged on every stall regardless of whether recovery follows, so that
      frequency can be tracked. Recovery is what matters, not occurrence.
  - pattern: 'Capture URB has stalled\.'
    metric: stalls_capture
    why: Same as playback -- expected, tracked, not a failure.
  - pattern: 'Resetting device to recover from stall after rate change'
    metric: resets_full
    why: The documented mitigation working as designed.
  - pattern: 'waited (\d+) ms for reset completion'
    metric: reset_wait_ms
    capture: 1
    why: >
      The value is the metric. Its distribution is the early-warning signal for
      the rate-change path, more useful than any single verdict.
  - pattern: 'stopped after \d+ consecutive URB errors; deferring recovery'
    metric: urb_error_giveup
    why: >
      Routine on unplug -- all eight in-flight URBs error at once -- so this is
      the normal path into disconnect, not an exotic one.
  - pattern: 'Failed to resubmit (?:playback|capture) URB: -(?:2|108)$'
    metric: urb_resubmit_teardown
    why: >
      -ENOENT and -ESHUTDOWN mean the URB was killed while a completion was
      already in flight, which is exactly what jockey3_stop_urbs() does. Every
      one of the 49 seen on the first hardware run landed in the microseconds
      after "deregistering interface driver".
      Deliberately matched by errno rather than by message: a resubmit failure
      with any OTHER error code is not teardown, and must stay a failure.
  - pattern: 'Firmware 0x[0-9a-f]{2} v\d+\.\d+\.\d+'
    why: >
      The firmware revision, which the runner parses out of the log because
      there is no sysfs attribute for it and adding one would be a change to
      the driver made for tests.

      Global rather than a per-case expectation, because it is not emitted
      once at probe as was long assumed: ploytec_get_firmware() sits inside
      ploytec_initialize_device(), which jockey3_set_rate() also calls, so the
      device re-reports on every rate change -- 63 times in one smoke run.
      Listing it only under JT-PROBE-001 failed every case that changes rate.
  - pattern: 'loading out-of-tree module taints kernel'
    metric: taint_out_of_tree
    why: >
      Every locally built module says this. build_module.sh compiles with M=,
      so the result is intree:N where the packaged module was intree:Y -- which
      means this appears from the moment a test build is deployed, and did not
      appear before. Expected, and worth counting only to notice if a run was
      unexpectedly made against a packaged module instead.
  - pattern: 'module verification failed: signature and/or required key missing'
    why: >
      MODULE_SIG_FORCE is deliberately off on the test kernels -- see
      tests/configs/README.md -- because locally built modules would otherwise
      not load at all. The complaint is expected and carries no information.
  - pattern: 'usbcore: (?:registered new|deregistering) interface driver snd-reloop-jockey3'
    metric: module_lifecycle
    why: >
      usbcore's own load/unload announcement. It carries the module name, so it
      reads as ours and would otherwise fail every case that cycles the driver
      -- which is what it did on the first hardware run.
  # The documented capture-recovery escalation. Each step is expected on a
  # healthy build and is tracked so the escalation rate is visible; only the
  # final give-up (in driver_fail) is a failure.
  - pattern: 'Capture URB stalled when opening capture stream; attempting recovery'
    metric: capture_recovery_on_open
    why: >
      Deferred recovery arriving where it was designed to: a capture stall left
      by an earlier rate change is picked up at the next capture open.
  - pattern: 'Restarting URBs to recover stalled Capture stream'
    metric: capture_urb_restart
    why: The lightweight first step of recovery, before any USB reset.
  - pattern: 'Capture stream still stalled after URB restart; queuing full USB reset'
    metric: capture_restart_escalated
    why: >
      Escalation from URB restart to a full reset. Expected sometimes; a rising
      proportion of restarts that escalate is the signal worth watching.
  # KUnit TAP scaffolding around the codec suite at module load. It is our
  # output, so it is classified here rather than as unrelated noise -- the
  # unrelated list is only consulted for lines that are not ours at all.
  # The verdicts are handled elsewhere: passes are counted from the summary
  # line below, failures are in driver_fail.
  - pattern: '^\s*# Subtest: ploytec'
  - pattern: '^\s*ok \d+ ploytec'
  - pattern: '^\s*# module: snd_reloop_jockey3'
  # Pinned to the suite line. KUnit emits a summary per nesting level, and a
  # '# ploytec\w*:' wildcard also swallows the two parameterized cases --
  # recording [30, 26, 21] per module load instead of [21], i.e. a metric
  # series mixing three different quantities.
  - pattern: '^\s*# ploytec-codec: pass:(\d+) fail:\d+'
    metric: kunit_cases_passed_on_target
    capture: 1
  - pattern: '^\s*# ploytec\w+: pass:\d+ fail:\d+'
    why: >
      With CONFIG_SND_USB_JOCKEY3_CODEC_KUNIT_TEST the codec suite runs at
      every module load, so the driver validates its own codec on the real
      hardware and real toolchain -- not just under QEMU.

      This counts the 21 top-level KUnit cases, which is NOT the 75 the
      catalog quotes: the parameterized cases expand into 75 individual
      results, and the kernel reports both --

          # ploytec-codec: pass:21 fail:0 skip:0 total:21
          # Totals: pass:75 fail:0 skip:0 total:75

      The metric was originally named as though it held the second number
      while reading the first. It has to read this line: "# Totals:" carries
      nothing identifying it as ours, so the classifier never offers it to
      these rules at all. Hence the deliberately specific name -- the two
      numbers are both real and measure different things, and a metric series
      is worthless if it silently changes which one it holds.

# Messages from our driver that are never acceptable, whatever the case.
driver_fail:
  - pattern: 'not ok \d+ .*ploytec'
    why: >
      A codec KUnit case failed on the target. The codec is the one part of
      this driver that is provably correct or provably not, so this is never
      ambiguous.
  - pattern: '# ploytec[\w-]*: pass:\d+ fail:[1-9]'
    why: >
      The suite's own summary reporting a non-zero failure count. This exists
      because the line above cannot be relied on alone: a failing parameterized
      case prints "not ok 5 zeros", which carries no ploytec or module name, so
      the classifier never treats it as ours and it lands in unclassified --
      surfaced for review, but not a failure. The summary line does identify
      itself as ours, so it is what turns a codec regression on target into a
      red run.
  - pattern: "unknown parameter '.*' ignored"
    why: >
      A module parameter the test framework passed was rejected. This is a
      setup defect, and it has to fail loudly because modprobe does not: a
      malformed dyndbg= query was accepted with exit status 0, the firmware
      revision was silently never logged, and every run recorded "firmware
      unknown" while otherwise passing. A run that quietly stops capturing
      what it exists to capture is worse than one that fails.
  - pattern: 'Inconsistent URB in-flight count'
    why: A self-check assertion in the driver. If it fires, accounting is wrong.
  - pattern: 'Timeout draining .* URB callbacks'
    why: >
      sync_stop gave up waiting. The next thing to happen is a use-after-free.
  - pattern: 'Rate mismatch'
    why: The hardware is not at the rate the driver believes it is at.
  - pattern: 'Capture URB too small'
    why: Endpoint delivered less than a packet; the format assumption is broken.
  - pattern: 'hardware may need power-cycling'
    why: >
      The give-up path. Recovery escalated all the way through a full USB reset
      and the stream is still dead.

# Anything matching these is a defect, not a test failure. The run is marked
# INVESTIGATE and the remaining profile is abandoned: the machine needs manual
# attention, and the right response is to open an issue and look at it -- not
# to retry, and not to record a count and carry on.
investigate:
  - pattern: 'BUG:'
  - pattern: 'WARNING:'
  - pattern: 'Call Trace:'
  - pattern: 'KASAN:'
  - pattern: 'UBSAN:'
  - pattern: 'possible circular locking dependency'
  - pattern: 'possible recursive locking'
  - pattern: 'INFO: task .* blocked for more than'
  - pattern: 'general protection fault'
  - pattern: 'unable to handle (kernel )?(page fault|NULL pointer)'
  - pattern: 'Oops'
  - pattern: 'kernel panic'
  - pattern: 'list_add corruption'
  - pattern: 'refcount_t:'

# Known-unrelated noise from the rest of the system. Ignored entirely.
#
# Keep this list short and justified. The temptation is to add anything that
# shows up twice; the cost is that a real message eventually matches one of
# these patterns and disappears. Prefer leaving something unclassified -- an
# unclassified line costs one glance, a wrongly ignored line costs a bug.
unrelated:
  # Generic KUnit/TAP framing. Unlike the ploytec-named lines above these
  # carry nothing identifying them as ours, and any suite in the kernel emits
  # them, so they are framework noise rather than driver output.
  - pattern: '^\s*(KTAP|TAP) version \d'
  - pattern: '^\s*1\.\.\d+$'
  # The codec suite's parameterized results: "ok 5 zeros", "ok 12 random00".
  # They are ours, but nothing in the text says so, and the classifier only
  # offers a line to the benign rules once it recognizes it as ours -- so
  # unrelated is the only bucket that can hold them. At 75 per module load and
  # ~20 loads in a smoke run they are the bulk of the log.
  #
  # Matched as 'ok' only, never 'not ok': a failing subtest must stay visible.
  # It lands in unclassified and is flagged, and the suite summary line in
  # driver_fail is what actually fails the run.
  - pattern: '^\s*ok \d+ [\w.-]+$'
  - pattern: '^\s*# (Subtest|Totals):'
  - pattern: '^\s*# [\w.-]+: pass:\d+ fail:\d+ skip:\d+'
  - pattern: 'usb \d+-[\d.]+: new (high|full|super)-speed USB device'
  - pattern: 'usb \d+-[\d.]+: New USB device (found|strings)'
  - pattern: 'usb \d+-[\d.]+: (Product|Manufacturer|SerialNumber):'
  - pattern: 'usb \d+-[\d.]+: USB disconnect'
  # usbcore announcing the reset the driver asked for. The driver's own
  # account of the reset is classified above as ours; this is the hub's, and
  # it carries nothing tying it to this device beyond the bus address.
  - pattern: 'usb \d+-[\d.]+: reset (high|full|super)-speed USB device'
  - pattern: 'input: .* as /devices/'
  - pattern: 'systemd\['
  - pattern: 'audit:'
  - pattern: 'perf: interrupt took too long'
  - pattern: 'pipewire|wireplumber|pulseaudio'
