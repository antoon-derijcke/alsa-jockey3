  - id: JT-SOAK-003
    title: Bind and unbind endurance
    area: SOAK
    level: L5
    mode: automated
    status: implemented
    requires: [device, root]
    exec: cases/probe_bind_unbind.py
    params:
      iterations_per_run: 5000
      settle_seconds: 5
    metrics: [bind_ms, unbind_ms, bind_call_ms, unbind_call_ms, slots_used]
    pass: No leak and no failure across thousands of cycles.
    notes: >
      Only meaningful on a KASAN kernel. The long form of JT-PROBE-002 --
      same case, cases/probe_bind_unbind.py, run for 5000 cycles instead of
      50. The metrics list matches JT-PROBE-002's rather than the
      memory_growth_kb/failures pair originally sketched here: the case
      breaks on the first failed cycle rather than counting failures across
      the run (consistent with probe_cycle.py and hotplug_cycle.py, and with
      the fact that classifying dmesg for a leak is the runner's job, not
      this case's -- see the JT-PROBE-002 notes above), so there is nothing
      for a "failures" metric to report beyond pass/fail. A slab-memory
      growth metric could be added later if a non-KASAN endurance signal
      turns out to be worth having, but the case script does not attempt it.

  - id: JT-SOAK-004
    title: Sustained MIDI OUT, watched for a URB stall
    area: SOAK
    level: L5
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/midi_soak.py
    params:
      duration_seconds: 1800
      load_fraction: 0.9
      messages_per_burst: 8
      check_interval_seconds: 30
      progress_interval_seconds: 60
    metrics:
      [elapsed_seconds, bytes_sent, bursts, write_failures, achieved_bps,
       urb_stalls_playback, urb_stalls_capture, urb_stall_onset_ms,
       urb_stall_recovered_ms, urb_stall_restarted_ms, urb_stall_deferred_ms]
    pass: >
      Every MIDI OUT write is accepted, the card is still present with all three
      substream types at the end, and every PLAYBACK URB stall that started
      during the soak also ended -- by recovering, or by a URB restart, which is
      how nearly all of them end. A stall that outlives the watchdog's
      one-minute heartbeat is failed by the runner from lib/rules.yaml; the case
      pairs onsets against endings itself as well, because the heartbeat needs
      the watchdog to still be ticking a minute later and a wedge near the end
      of the soak, or one the device does not survive, never gets there.

      Capture is counted but not asserted on. A capture stall while nothing is
      recording is deferred by design to the next capture open, which this case
      never performs, so it stays legitimately unended for the whole soak.
      Playback is never deferred -- it carries MIDI OUT -- so it is the
      direction a wedge shows up in, and it is what died on 2026-08-11.
    notes: >
      Hunting the 2026-08-11 wedge, which appeared minutes after the two MIDI
      cases and went unnoticed for about fourteen minutes. MIDI load is the
      first suspect only because of when it appeared; the root cause is still
      unknown.

      Worth running even when it passes. With the URB liveness watchdog in place
      a wedge is now reported within 1.5 s with a measured onset age, so this
      case either produces that timestamp or, over a long enough clean run, says
      the wedge is not reachable through MIDI load. The escalation work is gated
      on one of those two answers.

      Paced just UNDER the driver's ~3125 B/s ceiling on purpose. Overdriving it
      backs up the rawmidi buffer and produces the "rawmidi drain error" that
      lib/rules.yaml treats as a failure -- correctly, since on a healthy device
      it means the URB ring has died. Provoking it deliberately would make the
      case fail on its own doing and bury the one signature worth watching for.
