# Test catalog for the Reloop Jockey 3 driver.
#
# The register of every test case, whether or not it is implemented yet. A
# catalog that lists only what already works cannot show a gap, and showing
# gaps is half the point -- so unimplemented cases are listed with
# `status: planned` and appear in coverage reports as untested.
#
# See ../../docs/test_strategy.md for what the levels and areas mean.
#
# Fields
#   id            JT-<AREA>-<nnn>. Stable forever. Never encodes level or mode.
#   title         One line, imperative or descriptive.
#   area          BUILD CODEC PROBE PCM RATE AUDIO MIDI PM HOTPLUG SOAK
#   level         L1..L5 -- scope of what is exercised, not who runs it.
#   mode          automated | manual | semi-automated
#   status        implemented | planned | idea | deprecated | removed
#   requires      capability tokens the target must provide (see targets.yaml)
#   exec          automated only: script under cases/, relative to tests/hw
#   args          automated only: fixed arguments appended to exec
#   params        default parameters; profiles may override per target
#   metrics       names of values this case records beyond pass/fail
#   pass          what counts as a pass
#   expect_dmesg  driver messages that are NORMAL for this case (regexes)
#   steps         manual only: what the operator does
#   notes         anything worth knowing before running or changing it

version: 1

areas:
  BUILD:   Source as text and as a compilation unit
  CODEC:   The Ploytec bit-plane codec in isolation
  PROBE:   Enumeration, binding, module lifecycle
  PCM:     PCM substream lifecycle, formats, limits
  RATE:    Sample-rate switching and its recovery paths
  AUDIO:   Audio actually produced and captured
  MIDI:    Control surface in, LEDs out, running status
  PM:      Suspend, resume, reset
  HOTPLUG: Disconnect, replug, power loss
  INTEGRATION: Interoperability and integration with other subsystems
  SOAK:    Endurance and high repetition

levels:
  L1:      Build and static analysis
  L2:      Unit tests (no hardware)
  L3:      Driver functional tests
  L4:      Integration tests
  L5:      Endurance and stability tests

cases:

  # ------------------------------------------------------------------ BUILD

  - id: JT-BUILD-001
    title: checkpatch --strict against the upstream base
    area: BUILD
    level: L1
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/build_gate.py
    args: [checkpatch]
    metrics: [checkpatch_warnings]
    pass: No checkpatch errors or warnings on the diff against origin/for-next.
    notes: >
      FILE_PATH_CHANGES is ignored -- checkpatch raises it on the first added
      file of any patch without checking whether MAINTAINERS was touched, and
      this series does update MAINTAINERS.

  - id: JT-BUILD-002
    title: Build clean at W=12
    area: BUILD
    level: L1
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/build_gate.py
    args: [build]
    metrics: [build_warnings]
    pass: Module builds with zero warnings at W=12.
    notes: >
      Two -Wshadow warnings are expected and are not defects: 'index' in
      jockey3.c is the standard ALSA module-param idiom, and '__ret' comes from
      the wait_event_lock_irq_timeout() macro. Both are filtered, not silenced.

  - id: JT-BUILD-003
    title: Documentation gates -- kernel-doc, codespell, rst
    area: BUILD
    level: L1
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/build_gate.py
    args: [docs]
    metrics: []
    pass: kernel-doc -Wall -Werror, codespell and rst2html --strict all clean.

  - id: JT-BUILD-004
    title: Module size
    area: BUILD
    level: L1
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/build_gate.py
    args: [size]
    metrics: [ko_bytes, text_bytes, data_bytes, bss_bytes]
    pass: Metric-only. Records size; never fails.
    notes: >
      Answers "why did it grow fat?". Deliberately has no threshold -- a
      threshold would either be too loose to catch anything or would fail the
      build for a legitimate feature.

  - id: JT-BUILD-005
    title: Cross-compile for every target architecture
    area: BUILD
    level: L1
    mode: automated
    status: planned
    requires: [kernel-tree, cross-toolchains]
    metrics: [arches_built]
    pass: The module builds for x86_64, i386, arm64 and armhf.
    notes: >
      Catches arch-specific breakage without hardware. Partly covered today by
      the KUnit cross matrix, which builds the driver for six architectures as
      a side effect.

  # ------------------------------------------------------------------ CODEC

  - id: JT-CODEC-001
    title: KUnit codec suite under UML
    area: CODEC
    level: L2
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/codec_kunit.py
    args: [um]
    metrics: [tests_run, tests_passed]
    pass: All 75 tests pass.

  - id: JT-CODEC-002
    title: User-space bench correctness, all codec variants
    area: CODEC
    level: L2
    mode: automated
    status: implemented
    requires: []
    exec: cases/codec_bench.py
    args: [test]
    metrics: [variants_tested]
    pass: reference, opt64, opt32 and every candidate agree with the golden vectors.
    notes: >
      Also fails if build/src has drifted from the driver source, so a result
      cannot be attributed to the wrong revision.

  - id: JT-CODEC-003
    title: KUnit codec suite across the full architecture matrix
    area: CODEC
    level: L2
    mode: automated
    status: planned
    requires: [kernel-tree, cross-toolchains, qemu]
    params:
      targets: [um, i386, arm64, arm, riscv]
    metrics: [tests_run, tests_passed, arches_run]
    pass: 75/75 on every architecture.
    notes: >
      Slow (minutes per architecture). Belongs in regression, not smoke.
      s390 is opt-in via --extra and exists purely as a big-endian proof.

  - id: JT-CODEC-004
    title: KUnit codec suite against the portable reference codec
    area: CODEC
    level: L2
    mode: automated
    status: planned
    requires: [kernel-tree]
    metrics: [tests_run, tests_passed]
    pass: 75/75 with CONFIG_SND_USB_JOCKEY3_REFERENCE_CODEC=y.
    notes: >
      The reference codec is what the optimized variants are validated against,
      so it must itself be validated against the golden vectors.

  - id: JT-CODEC-005
    title: Codec throughput benchmark
    area: CODEC
    level: L2
    mode: automated
    status: planned
    requires: [quiet-machine]
    metrics: [encode_mbps, decode_mbps, encode_speedup, decode_speedup]
    pass: Metric-only.
    notes: >
      Must run natively -- QEMU timings are meaningless. Needs a machine that
      is otherwise idle, so it is not part of any routine profile.

  # ------------------------------------------------------------------ PROBE

  - id: JT-PROBE-001
    title: Module load and unload cycle
    area: PROBE
    level: L3
    mode: automated
    status: implemented
    requires: [device, root]
    exec: cases/probe_cycle.py
    params:
      iterations_per_run: 3
    metrics: [probe_ms, load_ms, unload_ms]
    pass: >
      The card appears with a playback and a capture substream and one rawmidi
      device after every load, and unloads cleanly every time.
    notes: >
      Also the case that captures the build identity and firmware revision for
      the run, so it should run early in every profile.

      The firmware message needs no expect_dmesg entry here: it is emitted on
      every rate change as well as at probe, so it lives in lib/rules.yaml as
      a global rule. Listing it in both places would be two sources of truth
      for one fact.

  - id: JT-PROBE-002
    title: Unbind and rebind stress
    area: PROBE
    level: L3
    mode: automated
    status: implemented
    requires: [device, root]
    exec: cases/probe_bind_unbind.py
    params:
      iterations_per_run: 50
      settle_seconds: 5
    metrics: [bind_ms, unbind_ms, bind_call_ms, unbind_call_ms, slots_used]
    pass: No memory errors, no double free, no leak across the cycles.
    notes: >
      Derived from scripts-alsa-dev/bind_unbind_test.sh. The reason it exists:
      devres was replaced with manual devm actions (jockey3_kfree_action), so
      the plausible regression is a leak or double free on the init-failure and
      disconnect paths. Only meaningful on a KASAN kernel.

      Unlike JT-PROBE-001 this drives the driver's bind/unbind through sysfs
      (/sys/bus/usb/drivers/snd-reloop-jockey3/{bind,unbind}) via
      jockey3-testctl rather than modprobe/rmmod: the module stays loaded and
      the device stays on the bus, so this exercises jockey3_probe() and
      jockey3_disconnect() specifically rather than module init/exit as well.
      This case does not classify dmesg itself -- that stays the runner's job
      per lib/case.py -- it only runs enough cycles for lib/rules.yaml's
      existing BUG:/KASAN: rules to have something to catch.

      bind_ms/unbind_ms are measured from when the jockey3-testctl call
      returns, not from when it starts, because the sysfs unbind write is
      synchronous and the helper call itself (sudo, bash, resolving the
      interface by vendor/product id) is tool cost, not driver work -- see
      hotplug_cycle.py's switch_ms for the same split done for JT-PROBE-003.
      That cost is recorded separately as bind_call_ms/unbind_call_ms so it
      cannot be mistaken for the thing being measured. slots_used repeats the
      JT-PROBE-003 card-index-reuse check, since a slot leak is exactly the
      shape a devm double-free would take if it corrupted card teardown
      instead of crashing outright.

  - id: JT-PROBE-003
    title: Card slot reuse across repeated unplug and replug
    area: PROBE
    level: L3
    mode: automated
    status: implemented
    requires: [device, usb-power]
    exec: cases/hotplug_cycle.py
    params:
      iterations_per_run: 10
      off_seconds: 2
      settle_seconds: 8
    metrics: [slots_used, card_index_first, card_index_last, enumerate_ms,
              teardown_ms, switch_ms, pcm_settle_ms, cycles]
    pass: >
      The device re-enumerates after every power cycle, with a playback and a
      capture substream and one rawmidi device, and the card index is reused
      rather than climbing. No slot leak after many cycles.
    expect_dmesg:
      - 'Failed to resubmit (?:playback|capture|MIDI IN) URB: -19$'
    steps:
      - >
        Note the current card index:
        awk '/RJ3/{print $1}' /proc/asound/cards
      - Unplug the USB cable, confirm the card disappears from /proc/asound/cards.
      - Plug it back in, confirm the card reappears.
      - >
        Repeat about ten times, and confirm the card index is REUSED rather
        than incrementing each cycle -- a climbing index is the slot leak
        this case exists to catch.
      - Confirm each replug still has a playback and a capture substream and
        one rawmidi device.
    notes: >
      Slot allocation is a bitmap under a mutex, so the failure is an index
      that climbs until it runs out rather than anything louder.

      Automated via per-port power switching on a ppps-capable USB hub
      (uhubctl), which the privileged helper drives through `usb-power`. On a
      machine without such a hub the case demotes to the manual steps above
      and is offered by checklist.py -- the coverage is worth having either
      way, and only the labor differs.

      A port power-off is NOT equivalent to pulling the cable. It is a clean,
      immediate VBUS drop: the device vanishes at once, resubmits fail
      synchronously with -19, and the -71 (EPROTO) burst a real unplug
      produces never happens. Measured 2026-08-10, idle and under active
      playback alike. That is fine for THIS case, which is about enumeration
      and slot reuse -- but it means the URB error give-up path is not
      exercised here. See JT-HOTPLUG-001 and JT-HOTPLUG-003.

  - id: JT-PROBE-004
    title: Reject a device with missing or malformed endpoints
    area: PROBE
    level: L3
    mode: automated
    status: idea
    requires: [gadget-emulation]
    pass: probe() fails cleanly with no resource leak.
    notes: >
      jockey3_validate_endpoints() is an error path that real hardware can
      never exercise. Would need a USB gadget or dummy_hcd emulating a
      malformed descriptor. Low priority, high novelty. Status is "idea"
      rather than "planned": there is no foreseeable way to mock a faulty
      Jockey 3 firmware, so this stays in the catalog but out of --list and
      the ledger until that changes.

  # -------------------------------------------------------------------- PCM

  - id: JT-PCM-001
    title: PCM open and close cycling
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/pcm_open_close.py
    params:
      iterations_per_run: 100
    metrics: [open_ms]
    pass: Every open succeeds and every close releases the substream.
    notes: >
      Derived from scripts-alsa-dev/test_open_close.sh. Not redundant with
      JT-PCM-002/004/005 and friends: those each open a substream once per run
      and spend the run on whatever they actually measure. This is the only
      case that repeats the open/close cycle itself, hundreds of times back to
      back with no playback or capture content of interest, so it is the one
      that would catch a leak or a state-release bug that only shows up on the
      Nth open. Playback and capture are cycled independently with
      aplay/arecord --samples (not --duration), so the cost per cycle does not
      depend on rate.

  - id: JT-PCM-002
    title: Playback at each supported rate
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/pcm.py
    args: [playback]
    params:
      rates: [44100, 48000, 88200, 96000]
      seconds: 3
    metrics: [xruns, first_audio_ms]
    pass: >
      Playback runs to completion at every requested rate with no xruns
      reported by the PCM status.
    expect_dmesg:
      - 'Playback URB has stalled\.'

  - id: JT-PCM-003
    title: Period and buffer size boundary matrix
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/pcm_limits.py
    params:
      period_sizes: [minimum, 120, 144, 1024, maximum]
      period_counts: [2, 4, 1024]
    metrics: [xruns, configs_accepted, configs_rejected]
    pass: >
      Every configuration inside the advertised limits works; every one outside
      is refused rather than accepted and then failing.
    notes: >
      From buffer_limits_validation.md. period_bytes_min is 120 for playback
      and 144 for capture, matching one URB payload. The interesting inputs are
      sizes that are not multiples of the frame size (12 bytes playback,
      18 capture), because the packet loop's wrap-around arithmetic depends on
      that division.

  - id: JT-PCM-004
    title: Capture at each supported rate
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/pcm.py
    args: [capture]
    params:
      rates: [44100, 48000, 88200, 96000]
      seconds: 3
    metrics: [xruns, captured_bytes, nonzero_channels]
    pass: >
      Capture produces the expected byte count at every rate. With nothing
      connected to the inputs the data may be silent, so silence is not a
      failure here -- JT-AUDIO-004 is what checks signal presence.
    expect_dmesg:
      - 'Capture URB has stalled\.'

  - id: JT-PCM-005
    title: Simultaneous playback and capture
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/pcm.py
    args: [duplex]
    params:
      rates: [44100, 96000]
      seconds: 4
    metrics:
      - xruns_playback
      - xruns_capture
      - avail_max_playback
      - avail_max_capture
      - rms_dbfs
      - rms_dbfs_min
    pass: Both directions run concurrently without xruns.
    expect_dmesg:
      - 'Playback URB has stalled\.'
      - 'Capture URB has stalled\.'
    notes: >
      Full duplex is the normal DJ case and stresses both URB rings and the
      lock ordering at once.

      rms_dbfs is the per-channel capture level, printed on the terminal as
      the case runs and recorded per rate. It is informational only and never
      fails the case: with nothing plugged into the inputs a noise floor
      around -90 to -110 dBFS is the correct reading; with a loopback cable
      and a known source it will read far higher. Only whoever is running the
      case knows what is plugged in, so the number is surfaced for them to
      judge rather than compared against a threshold here -- the same reason
      JT-PCM-004 does not fail on silence either. rms_dbfs_min is the worst
      (highest) channel of that same reading, alone, so the ledger has a
      single scalar to trend across runs.

      Superseded the manual steps that used a fixed 20 s arecord and
      actions/play_channel_sweep.sh in two terminals -- cases/pcm.py's duplex
      mode does the same thing under runner.py, plus the level.

      Worth automating: the verdict is "no xruns, both ran", which needs no
      human judgement. Manual only until someone writes the case.

  - id: JT-PCM-006
    title: Unsupported hw_params are refused
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/pcm_hw_params_refused.py
    metrics: [configs_tested, configs_accepted, configs_refused]
    pass: >
      Wrong channel counts, unsupported formats and unsupported rates are
      rejected at hw_params rather than accepted and then misbehaving.
    notes: >
      Channels are fixed (4 playback, 6 capture) and the only format is
      S24_3LE, so this is a short, cheap and genuinely useful case.

      For each stream, three individually-wrong configs (channel count,
      format, rate) must be refused, and one all-correct control must
      succeed. The control is the one that makes it a test rather than a
      formality: four commands that all fail prove nothing if the fifth
      would have failed too.

      The accept/refuse verdict comes from libasound's exact hw_params
      setters (dir=0), not aplay/arecord's exit code: aplay's -r negotiates
      rate with snd_pcm_hw_params_set_rate_near(), which silently rounds an
      unsupported rate to the nearest one the device offers and exits 0,
      the same "near" rounding trap pcm_limits.py (JT-PCM-003) documents
      for period and buffer size. Channels and format have no such
      rounding, but rate does, so all three are probed the exact way for
      consistency. Confirmed on hardware: an earlier plain-exit-code
      version of this case reported the unsupported-rate probe as refused
      when aplay had actually been rounded to 44100 and never asked the
      driver for 22050 at all.

      No dmesg check for "accepted and then coped": classification from the
      kernel log is the runner's job (see lib/case.py), not the case's.

      Use hw: and never plughw: -- plughw exists precisely to convert these
      away, and would turn every case here into a pass.

  - id: JT-PCM-007
    title: Achievable latency sweep
    area: PCM
    level: L3
    mode: automated
    status: planned
    requires: [device, sox]
    metrics: [min_clean_period_bytes, min_clean_latency_ms]
    pass: Metric-only. Records the smallest period size that runs clean.
    notes: >
      A better latency number than any single measurement, and directly
      comparable across builds -- provided the machine profile matches.

  # ------------------------------------------------------------------- RATE

  - id: JT-RATE-001
    title: Sample-rate change loop
    area: RATE
    level: L3
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/rate_change.py
    params:
      rates: [44100, 48000, 88200, 96000]
      # Four seconds, not one. A one-second measurement is dominated by
      # process start-up -- 0.4-0.7 s of sox, aplay and device open, measured
      # on alsa-test -- so the elapsed-time rate check cannot resolve anything
      # at that length, and a second of audio is thin evidence in its own
      # right. At four seconds the fixed cost is 10-17% against a 20%
      # tolerance, which is the point where the ratio starts to mean
      # something. Profiles that want many iterations rather than accurate
      # ones override it back down and lose the timing check, knowingly.
      seconds_per_rate: 4
      iterations_per_run: 10
      capture: true
      min_nonzero_fraction: 0.01
      rate_tolerance: 0.20
      # Wider than rate_tolerance on purpose. The capture ratio's denominator
      # is wall clock from process start, so it carries arecord start-up and
      # device open and reads 10-17% low even when the device is clocking
      # perfectly. It is now only a fallback for changes where no pointer
      # window could be measured, and only gross error is failed.
      capture_rate_gross_tolerance: 0.50
      timing_check_min_seconds: 4.0
      # The rate measurement that actually decides the verdict: the slope of
      # the device's own hw_ptr, sampled from /proc/asound while the stream
      # runs. settle_seconds is skipped after the pointer first moves, then the
      # rate is taken across the longest span of at least
      # steady_min_window_seconds in which the pointer never stops for longer
      # than plateau_seconds. Start-up, device open and every buffer in the
      # path are outside that window instead of averaged into it; buffer size
      # does not enter it at all, since a buffer shifts latency and not rate.
      #
      # 5% is the target: enough to settle "did the rate change take effect",
      # which is the only question being asked. The instrument is roughly ten
      # times better than that, and is deliberately not tightened to what it
      # can do -- at that point it would start reporting the device's crystal.
      steady_tolerance: 0.05
      settle_seconds: 0.5
      plateau_seconds: 0.15
      steady_min_window_seconds: 1.0
      pointer_poll_seconds: 0.02
      # Which stream performs the rate change, and therefore which branch of
      # jockey3_pcm_hw_params() is under test. capture -> capture_open=1, so a
      # capture stall resets on the spot. playback -> capture_open=0, so it is
      # deferred to the capture open that follows. race -> whichever process
      # won, which is what this case did before the parameter existed and is
      # kept only for reproducing older runs.
      # interleave alternates from the ends of the sorted list, which makes
      # every step large and alternating -- the shape that provokes the fault.
      # as-given uses `rates` verbatim, which is how a sweep is built to
      # separate hypotheses the default order cannot: with these four rates
      # both downward steps cross clock families and both upward steps stay
      # within one, so direction and family are perfectly correlated.
      sweep_order: interleave
      rate_change_stream: capture
      # Idle time between changes, with nothing open. Kept separate from
      # seconds_per_rate so that "the device needs recovery time between
      # changes" can be tested without also changing the length of the
      # measurement. The reset that hw_params queues is not waited for, so at
      # zero gap consecutive changes are not independent events.
      gap_seconds: 0
    metrics:
      # THE metric for milestone 13: how often a rate change costs the user an
      # audible device reset. It must trend to zero. Counted from the run
      # totals rather than the per-change attribution, so a marker that failed
      # to land cannot quietly turn it into a clean result. Its companions say
      # which way it moved -- fewer stalls, or the same stalls handled by a URB
      # restart instead of a reset, which is progress that would otherwise be
      # invisible.
      [resets_per_change_pct, resets_total_device, stalls_per_change_pct,
       urb_restarts_that_avoided_a_reset,
       stalls_capture, stalls_playback, resets_capture_stall,
       resets_playback_stall, resets_full, capture_urb_restart,
       capture_recovery_on_open, capture_restart_escalated,
       failures, capture_live_changes,
       capture_nodata_changes, capture_silent_changes, capture_error_changes,
       first_bad_capture_change, capture_nonzero_min, capture_nonzero_max,
       capture_effective_hz, capture_rate_ratio_min, capture_rate_ratio_max,
       playback_rate_ratio_min, playback_rate_ratio_max,
       # The rate change's own stall, told apart from the three later call
       # sites that share its message. This is the incidence figure.
       capture_stall_hw_params_total, capture_stall_on_open_total,
       capture_stall_after_urb_restart_total, capture_stall_after_reset_total,
       # Both of these end in usb_queue_reset_device(); what differs is
       # only what was tried first, never how big the reset is.
       reset_on_rate_change_total, reset_after_urb_restart_total,
       stalled_after_full_reset_total, reset_timeout_total,
       # Which recovery path each change actually took, counted over the run.
       branch_reset, branch_recovered_on_open, branch_deferred, branch_clean,
       # Incidence grouped the three ways open question 2 of
       # re/rate_change_stall.md asks for.
       stalls_direction_up, stalls_direction_down, stalls_direction_first,
       stalls_family_cross, stalls_family_within,
       rate_change_stream, gap_seconds, lead_stream_configure_timeouts,
       # The steady-state clock measurement, and the start-up cost it excludes.
       steady_ratio_playback_min, steady_ratio_playback_max,
       steady_ratio_capture_min, steady_ratio_capture_max,
       steady_error_playback_pct, steady_error_capture_pct,
       steady_unmeasured_playback, steady_unmeasured_capture,
       startup_s_playback_min, startup_s_playback_max,
       startup_s_capture_min, startup_s_capture_max,
       # A pointer that stops and resumes is a stall seen from the host, at the
       # poll interval rather than at the watchdog's one second.
       pointer_plateau_changes_playback, pointer_plateau_changes_capture,
       pointer_quantum_max, xruns,
       buffer_size_playback, period_size_playback,
       buffer_size_capture, period_size_capture]
    pass: >
      Every rate change ends with working streams in BOTH directions. A stall
      that recovers is a PASS and is counted; a stall that survives a full USB
      reset is a FAIL, and so is a capture that comes back bit-exact silent.

      resets_per_change_pct is not part of the pass criterion and deliberately
      so -- a threshold would have to be picked, and any value above zero would
      bless the fault. It is the number the driver is judged on over time
      instead: it must trend to zero, and a build where it has not moved has
      survived the fault rather than fixed it. The case prints it at the end of
      every run for that reason.

      Capture is judged exactly as in JT-AUDIO-005: a running converter carries
      a noise floor whether or not anything is patched in, so an all-zero
      capture is an engine that never restarted, not a quiet input. The floor
      is 1% of frames non-zero, against >95% observed when healthy.

      Recording also matters for what it makes the DRIVER do: with a capture
      stream open, jockey3_pcm_hw_params() takes its reset path on a capture
      stall instead of the deferred one, which is the path that carries the
      risk and was untested while this case only played.

      The rate itself is checked against the clock, not against the device.
      This is independent of what GET_RATE reports, which only proves the
      firmware accepted the value into a register -- exactly the gap in which
      this device's known faults live, where every return code is correct and
      the stream is not.

      It is measured from hw_ptr, the device's own frame counter, sampled from
      /proc/asound while the stream runs, and taken in steady state: after
      settle_seconds, across the longest plateau-free span, in BOTH directions.
      Either direction outside steady_tolerance fails. Timing a whole aplay or
      arecord invocation instead -- which is what this case used to do -- gives
      rate / (1 + startup/duration) and reads 10-17% low at four seconds even
      when the device is perfect; the excluded cost is now measured and
      reported as startup_s_*, rather than charged to the sample rate. Buffer
      size does not enter the measurement: a buffer shifts latency, not rate.

      A pointer that stops and later resumes is a STALL, reported as such with
      its onset and duration, and the rate is measured around it rather than
      through it. Averaging a stall into the rate would report the fault this
      driver has as the fault it does not, in the same bucket.

      The elapsed-time ratios are still recorded as cross-checks, and are all
      that is left where no pointer window could be measured; there they are
      judged only against capture_rate_gross_tolerance.

      Which branch was under test is part of the result. rate_change_stream
      fixes whether hw_params sees capture_open=1 (reset on the spot) or 0
      (defer to the next capture open); branch_change_* records what each
      change actually did, so a run that drifted onto the other branch is
      visible rather than assumed away. Two runs may only be compared as
      measurements of the same quantity if they used the same arm -- and a
      capture:false run is never such a measurement: with nothing to recover a
      deferred stall, capture stays dead and hw_params re-logs the stall at
      every later change, so its count is one outage re-detected, not
      per-change incidence.
    expect_dmesg:
      - 'Playback URB has stalled\.'
      - 'Capture URB has stalled\.'
      - 'Resetting device to recover from stall after rate change'
      - 'Capture URB stalled when opening capture stream'
      - 'Restarting URBs to recover stalled Capture stream'
    notes: >
      THE most important case in this catalog, and the one with the least
      obvious criterion. Capture stall after a rate change is expected on a
      healthy build -- the driver logs it deliberately so frequency can be
      tracked. "No warnings" would fail every run on a perfectly good driver.
      Worst case is a downward switch, so the rate list should not be sorted.

      The parameter sweeps this case exists to serve are run with --param
      rather than by editing the values above, e.g.

        ./runner.py --case JT-RATE-001 --unattended \
            --param rate_change_stream=playback --param gap_seconds=3

      run.json records the resolved parameters, so every arm identifies itself.

      No reset_wait_ms metric is listed: the message lib/rules.yaml looks for,
      "waited N ms for reset completion", is not in the driver.
      jockey3_wait_for_reset_completion() logs only a dev_dbg on entry and a
      dev_warn on timeout, so the reset duration is not currently observable
      from the log at all. See re/rate_change_stall.md.

  - id: JT-RATE-002
    title: Sample-rate change under full duplex
    area: RATE
    level: L3
    mode: manual
    status: implemented
    requires: [device, sox, human]
    metrics: [stalls, stalls_recovered, resets_full, failures]
    pass: >
      A second stream at the same rate is accepted; at a different rate it is
      refused by the ALSA core, without the driver's own -EBUSY check firing.
      After both close, a rate change works and any capture stall recovers.
    steps:
      - 'Resolve the card: CARD=$(awk ''/RJ3/{print $1}'' /proc/asound/cards)'
      - >
        Start a long capture and leave it running:
        arecord -D hw:$CARD,0 -f S24_3LE -c 6 -r 44100 -d 60 /tmp/fdx.wav
      - >
        While it runs, confirm playback at the SAME rate is accepted:
        aplay -D hw:$CARD,0 -f S24_3LE -c 4 -r 44100 /dev/urandom
      - >
        And that a DIFFERENT rate is refused, by the ALSA core rather than by
        the hardware failing:
        aplay -D hw:$CARD,0 -f S24_3LE -c 4 -r 96000 /dev/urandom
        should exit immediately with an invalid-argument error.
      - >
        Confirm dmesg does NOT contain "Cannot change rate while other stream
        is active". That message is the driver's own sanity check; reaching it
        means the open-time constraint failed to do its job first.
      - Stop both streams.
      - >
        Now change the rate with nothing running, then immediately open
        capture at the new rate:
        aplay -D hw:$CARD,0 -f S24_3LE -c 4 -r 96000 -d 2 /dev/urandom ;
        arecord -D hw:$CARD,0 -f S24_3LE -c 6 -r 96000 -d 5 /tmp/after.wav
      - >
        In dmesg, confirm any capture stall was followed by a recovery, and
        that none reached "hardware may need power-cycling".
    notes: >
      REWRITTEN 2026-08-10 after an operator marked the previous version
      invalid, which it was. It said to hold capture open at 44100 and sweep
      the playback rate. That cannot happen: jockey3_pcm_open() applies
      snd_pcm_hw_constraint_single(RATE, current_rate) while another stream is
      open, so the ALSA core refuses the second stream at any other rate
      before the driver is ever consulted. The device has one global rate.

      What is left is worth testing, and is what the case now does: that the
      constraint is real and enforced in the right place. The driver also
      carries its own -EBUSY sanity check for more than one active stream, and
      that message appearing would mean the constraint had failed first --
      which is why its ABSENCE is a step.

      Note this no longer reaches a "capture stall while playback changes
      rate" case, because that state is unreachable by construction. The
      direction-aware recovery is exercised where it actually occurs: capture's
      own hw_params, which JT-PCM-004 already records as
      capture_recovery_on_open.

      The predecessor scripts-alsa-dev/test_rate_change_fdx.sh should be read
      with the same suspicion before being trusted.

  - id: JT-RATE-003
    title: Rate change endurance
    area: RATE
    level: L5
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/rate_change.py
    params:
      # Same case as JT-RATE-001, run long instead of accurate: no
      # seconds_per_rate override, so it keeps the script's 1 s default
      # rather than JT-RATE-001's 4 s. At 5000 iterations x 4 rates that is
      # already the historical ~10 hour mileage; spending 4 s per change on
      # top would take this past a day for no endurance benefit. The
      # steady-state pointer measurement still runs at 1 s -- it just
      # resolves fewer of the changes, which is recorded as
      # steady_unmeasured_* rather than failed. rate_change_stream is left at
      # the script default (capture), so a JT-RATE-003 run is directly
      # comparable to a default JT-RATE-001 run on resets_per_change_pct.
      iterations_per_run: 5000
    metrics:
      # Identical to JT-RATE-001's list, on purpose: the whole point of this
      # case is that resets_per_change_pct and its companions are the SAME
      # measurement taken long instead of short, so a drift between the two
      # is visible as a difference rather than as two incomparable numbers.
      [resets_per_change_pct, resets_total_device, stalls_per_change_pct,
       urb_restarts_that_avoided_a_reset,
       stalls_capture, stalls_playback, resets_capture_stall,
       resets_playback_stall, resets_full, capture_urb_restart,
       capture_recovery_on_open, capture_restart_escalated,
       failures, capture_live_changes,
       capture_nodata_changes, capture_silent_changes, capture_error_changes,
       first_bad_capture_change, capture_nonzero_min, capture_nonzero_max,
       capture_effective_hz, capture_rate_ratio_min, capture_rate_ratio_max,
       playback_rate_ratio_min, playback_rate_ratio_max,
       capture_stall_hw_params_total, capture_stall_on_open_total,
       capture_stall_after_urb_restart_total, capture_stall_after_reset_total,
       reset_on_rate_change_total, reset_after_urb_restart_total,
       stalled_after_full_reset_total, reset_timeout_total,
       branch_reset, branch_recovered_on_open, branch_deferred, branch_clean,
       stalls_direction_up, stalls_direction_down, stalls_direction_first,
       stalls_family_cross, stalls_family_within,
       rate_change_stream, gap_seconds, lead_stream_configure_timeouts,
       steady_ratio_playback_min, steady_ratio_playback_max,
       steady_ratio_capture_min, steady_ratio_capture_max,
       steady_error_playback_pct, steady_error_capture_pct,
       steady_unmeasured_playback, steady_unmeasured_capture,
       startup_s_playback_min, startup_s_playback_max,
       startup_s_capture_min, startup_s_capture_max,
       pointer_plateau_changes_playback, pointer_plateau_changes_capture,
       pointer_quantum_max, xruns,
       buffer_size_playback, period_size_playback,
       buffer_size_capture, period_size_capture]
    pass: >
      Same per-change criterion as JT-RATE-001 -- a stall that recovers is a
      pass, a stall that survives a full USB reset or a capture that comes
      back bit-exact silent is a fail -- run over thousands of changes instead
      of ten. What this case exists to answer is not "does it pass" but "does
      resets_per_change_pct drift": ledger.py trends it per target, and a
      build where the short JT-RATE-001 number looks fine but this one climbs
      has not fixed Milestone 13's fault, only kept it below the noise floor
      of a short run.
    expect_dmesg:
      - 'Playback URB has stalled\.'
      - 'Capture URB has stalled\.'
      - 'Resetting device to recover from stall after rate change'
      - 'Capture URB stalled when opening capture stream'
      - 'Restarting URBs to recover stalled Capture stream'
    notes: >
      The long-running version of JT-RATE-001, historically run for ten hours
      at a time -- same script (cases/rate_change.py), same metrics, same
      pass criterion, only iterations_per_run differs. See JT-RATE-001 for
      why the criterion is "stalled and recovered = pass" rather than
      "no stall", and re/rate_change_stall.md for the working notes this case
      was written to serve.

      resets_per_change_pct is the same headline figure JT-RATE-001 prints, and
      is what makes the two comparable: a short run and a ten-hour one both
      answer "how often does a rate change cost a device reset", so a rate that
      is good in the small and bad in the large is visible as a difference
      between them rather than as two incomparable numbers.

      Run with --timeout comfortably above the expected duration, same as any
      other soak-profile case -- runner.py's default is 3600s and this case is
      designed to run far longer than that.

      KNOWN DEGRADATION on a long run: attribution is read from ONE
      kmsg.read_log() call after the last change, and the kernel ring buffer
      is finite while this run is not. At thousands of changes x two markers
      each, plus every stall/reset line, a long run can outlast the buffer,
      and the early part of the log -- including some of the markers this
      depends on -- can already be gone by the time it is read.

      That degrades visibly rather than silently: markers_found_in_log vs
      markers_written, and attribution_trustworthy, say so, and per-change
      figures (branch_change_*, stalls_direction_*, etc.) are suppressed
      rather than shown wrong when it happens. The RUN-TOTAL figures --
      resets_per_change_pct, stalls_per_change_pct and their *_total
      companions -- are NOT suppressed and remain the pass/fail and trend
      metrics, but on a wrapped run they become a LOWER bound: events that
      scrolled out of the buffer before the read are undercounted, never
      double-counted, so a wrapped run can only ever read better than it
      actually was. A continuous-capture fix (following the log as it is
      written, rather than reading it once at the end) would remove this
      bound; it was scoped out here as a larger change than this case's
      wiring, deliberately, rather than risk a fix that double-counts
      instead -- see re/rate_change_stall.md.

  - id: JT-RATE-004
    title: Rate change while the device is being removed
    area: RATE
    level: L3
    mode: automated
    status: implemented
    requires: [device, root, usb-power, sox]
    exec: cases/rate_change_power_loss.py
    params:
      iterations_per_run: 6
      rates: [44100, 48000, 96000]
      seconds: 2
      off_seconds: 2
      settle_seconds: 8
      race_ms_min: 20
      race_ms_max: 120
    metrics: [cycles, races_observed, enumerate_ms, card_index_first, card_index_last]
    pass: >
      The device re-enumerates after every cycle with all three substream types,
      and a rate change still works afterwards. No submit failure and no
      "Endpoints are disabled" anywhere in the log -- both are driver_fail in
      lib/rules.yaml, so the runner enforces that part, not the case.
    expect_dmesg:
      - 'Failed to initialize device to change rate'
      - 'Firmware version read failed'
      - 'URB stream stalled: no completion for'
    steps:
      - 'Resolve the card: CARD=$(awk ''/RJ3/{print $1}'' /proc/asound/cards)'
      - >
        Start a rate change and pull the cable roughly a tenth of a second
        later: aplay -D hw:$CARD,0 -f S24_3LE -c 4 -r 96000 /dev/urandom
      - Plug it back in and wait for the card to reappear.
      - >
        Confirm dmesg contains NO "Failed to submit ... URB: -2" and no
        "Endpoints are disabled after ...". A -110 from "Failed to initialize
        device to change rate" is acceptable; -2 on submit is not.
      - >
        Confirm a rate change still works:
        aplay -D hw:$CARD,0 -f S24_3LE -c 4 -r 44100 -d 2 /dev/urandom
      - Repeat a few times.
    notes: >
      Regression cover for the 2026-08-11 -ENOENT cascade. usb_set_interface()
      disables an interface's endpoints as its first action and does not
      re-enable them when SET_INTERFACE fails, so a rate change against a device
      that has stopped answering EP0 left interface 0 permanently dead --
      EP 0x05 and EP 0x83 returning -2 on every submit while interface 1, never
      reached, kept working. That asymmetry is what identified the mechanism.

      This case CANNOT reproduce the original wedge, which needs a device that
      is still enumerated but silent. It reaches the same code path the only way
      a machine can on demand: the window between VBUS dropping and the kernel
      marking the device NOTATTACHED, in which a control transfer is submitted
      and never completes.

      The window is narrow and not under our control, so races_observed is
      recorded rather than asserted -- a run of zeroes means nothing was
      provoked, which is different from a clean pass and must not read as one.

  # ------------------------------------------------------------------ AUDIO

  - id: JT-AUDIO-001
    title: Channel map sweep -- each output in turn
    area: AUDIO
    level: L3
    mode: manual
    status: implemented
    requires: [device, speakers, human]
    params:
      rates: [44100, 48000, 88200, 96000]
    pass: >
      Each of the four playback channels produces a tone from the correct
      physical output, at the correct pitch, one at a time.
    steps:
      - Run actions/play_channel_sweep.sh <rate>.
      - >
        Confirm four tones in order: Master L (E3), Master R (A3),
        Headphone L (D4), Headphone R (G4).
      - Confirm each sounds from one output only, and at the expected pitch.
      - Repeat for each rate under test.
    notes: >
      Pitch matters as much as presence: a wrong pitch at the right channel
      means the rate was not actually applied. From the test_channels_*.sh
      family.

  - id: JT-AUDIO-002
    title: Output presence and channel map via loopback
    area: AUDIO
    level: L3
    mode: automated
    status: planned
    requires: [device, loopback-cable]
    params:
      rates: [44100, 48000, 88200, 96000]
    metrics: [rms_per_channel, crosstalk_db]
    pass: >
      A tone played to one channel appears above threshold on the corresponding
      capture channel and below threshold on the others.
    notes: >
      Uses the device's own I/O -- master out into In 1, headphone out into
      In 2 -- so no second sound card is needed. RMS presence only. Artifacts
      and distortion are left to the ear, which is better at it.

  - id: JT-AUDIO-003
    title: Real content playback, listened to
    area: AUDIO
    level: L3
    mode: manual
    status: implemented
    requires: [device, speakers, human]
    pass: >
      Music plays cleanly: no clicks, dropouts, distortion, or channel
      swapping, at each rate tried.
    steps:
      - Play a known-good FLAC or WAV to the device (actions/play_file.sh).
      - Listen on Master and on Headphones.
      - Note anything audible, however minor, in the comment field.
    notes: >
      The only test that can catch codec packing errors as they actually
      manifest. Worth doing at 44.1 and 96 kHz at minimum.

      Disabled on the debug targets, and that is not caution. Measured
      2026-08-09: the same file crackles audibly on x86_64-debug and plays
      cleanly on x86_64-prod, with xrun_counter zero and avail_max around 5500
      on both -- so ALSA is comfortable either way and the gap is downstream of
      it, in URBs resubmitted late under KASAN. Asking "did it sound clean?"
      there records a fail against the driver for the kernel's overhead.

      If this fails on a PRODUCTION kernel, that reasoning does not apply and
      it is a real defect. Check xrun_counter and avail_max first; if both are
      clean, the cause is past where /proc/asound can see and the next step is
      a wire-level trace -- see docs/test_strategy.md section 11a and
      re/usb/openvizsla/README.md. Play from a decoded file rather than a
      sox pipe before concluding anything, so userspace is out of the path.

  - id: JT-AUDIO-004
    title: Capture signal presence
    area: AUDIO
    level: L3
    mode: semi-automated
    status: planned
    requires: [device, signal-source]
    metrics: [rms_per_channel]
    pass: All six capture channels carry signal when driven.
    notes: >
      In1 L/R, In2 L/R and the microphone, which is mono duplicated across
      channels 5 and 6. Mic level is known to be lower than under Windows --
      Windows applies software gain -- so this is not a defect.

  - id: JT-AUDIO-005
    title: Device audio engine starts after a power cycle
    area: AUDIO
    level: L3
    # Automated, not semi-automated, and the distinction is load-bearing: mode
    # semi-automated makes the runner derive a need for `human`, which would
    # withhold this case from exactly the unattended runs the mains switch
    # exists to enable. That derivation guards cases that ASK something and
    # would hang waiting for an answer. This one only ever instructs, never
    # blocks on input, and takes the bus as its witness either way -- so with
    # device-power it needs nobody. Without it, the case says so and blocks,
    # and the steps below are how a person does it instead.
    mode: automated
    status: implemented
    requires: [device, root]
    exec: cases/audio_engine_start.py
    params:
      trigger: device_power
      iterations_per_run: 10
      off_seconds: 5
      seconds: 2
      rate: 44100
      min_nonzero_fraction: 0.01
      operator_timeout_seconds: 120
    metrics: [cycles, silent_cycles, first_silent_cycle, nonzero_fraction_min,
              nonzero_fraction_max, enumerate_ms_max, trigger]
    pass: >
      Every power cycle leaves a device that actually produces audio. Capture
      carries a noise floor -- a running converter is never bit-exact silent,
      and the working runs measure above 95% of frames non-zero. A capture
      that is entirely zero means the device accepted the stream and never
      started its audio engine, which no dmesg line and no xrun counter
      reports.
    notes: >
      Observed 2026-08-13 on the production kernel: three consecutive power
      cycles produced a device that enumerated, probed, programmed and
      verified its rate, and accepted every playback sample while emitting
      nothing. The control plane was byte-identical to the cycle that worked.

      Needs a real device power cycle. Ten re-enumerations through the ppps
      hub switch all recovered correctly -- the Jockey 3 is self-powered, so
      cutting VBUS is a cable unplug rather than a power-off, and the two are
      not equivalent to the device.

      It therefore switches the device's own mains supply: a network relay
      when one is configured (device-power, see lib/power/), otherwise an
      operator working the switch by hand. With a relay it runs unattended,
      which is what makes a fault this intermittent practical to chase. The
      case blocks itself if neither is available, which is why device-power
      and human are not listed as requirements -- either will do.

      Set trigger:usb_power for the automated regression baseline, or
      trigger:module_reload to re-probe a device that stayed powered.
    expect_dmesg:
      # Single backslashes. YAML single-quoting has no escape sequences, so
      # '\\d' reaches re as a literal backslash followed by 'd' and matches
      # nothing -- which is how 'callbacks suppressed' sat in the unclassified
      # bucket of every run this case ever produced, including the baseline.
      #
      # MIDI IN belongs in the "stopped after" alternation alongside Playback
      # and Capture: cutting the mains kills all three streams, and the MIDI
      # line is not covered by the benign rule in lib/rules.yaml because that
      # one anchors on "; deferring recovery", which only Playback and Capture
      # emit.
      - 'jockey3_urb_error_give_up: \d+ callbacks suppressed$'
      - '(?:Playback|Capture|MIDI IN) URB error: -71'
      - '(?:Playback|Capture|MIDI IN) stopped after \d+ consecutive URB errors'
      - 'Failed to resubmit MIDI IN URB: -19$'
    steps:
      - >
        Switch the device off, wait for the LEDs to go dark, and switch it
        back on. Wait for the card to reappear in /proc/asound/cards.
      - >
        Capture two seconds from it, for example
        `arecord -D hw:CARD -f S24_3LE -c 6 -r 44100 -d 2 -t raw /tmp/e.raw`.
      - >
        Check whether any byte of that capture is non-zero, e.g.
        `python3 -c "print(any(open('/tmp/e.raw','rb').read()))"`. True is a
        pass. False means the device never started its audio engine, even
        though playback was accepted and dmesg is clean.
      - >
        Repeat ten times. The fault is intermittent -- three failures in four
        cycles were seen on 2026-08-13, and a single passing cycle proves
        nothing.
      - >
        If a cycle fails, keep the capture and take an OpenVizsla trace of the
        next attempt; see re/usb/init_timing_comparison.md.

  # ------------------------------------------------------------------- MIDI

  - id: JT-MIDI-001
    title: Control surface events reach userspace
    area: MIDI
    level: L3
    mode: semi-automated
    status: implemented
    requires: [device, python-mido]
    exec: cases/midi_controls.py
    params:
      watch_seconds: 30
      button_events: 5
      continuous_events: 20
      answer_timeout: 120
    metrics: [button_events, continuous_events]
    pass: >
      Button presses, fader and knob movements, and jog wheel rotation all
      produce MIDI events.
    steps:
      - Run scripts-alsa-dev/miditest/miditest.py and press 'd' for hexdump.
      - Press several buttons; confirm note events appear.
      - >
        Move a fader or knob, and rotate a jog wheel; confirm a stream of
        events appears. Which control produced them does not matter -- the
        driver's code path does not know, so any swept control proves the
        same thing.
    notes: >
      Verifying every individual control is out of scope -- that tests Reloop's
      firmware. If the driver delivers one button and one jog movement it
      delivers all of them; the code path does not know which control moved.

  - id: JT-MIDI-002
    title: LEDs respond to MIDI OUT
    area: MIDI
    level: L3
    mode: semi-automated
