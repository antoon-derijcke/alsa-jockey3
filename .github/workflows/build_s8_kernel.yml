name: Build Galaxy S8 DJ Kernel (dreamlte)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Jockey 3 Driver Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang-11 llvm-11 lld-11 bc bison flex libssl-dev libncurses5-dev git ccache zip mkbootimg

      - name: Clone Galaxy S8 Kernel Source (Lineage 18.1 / 8d79a2d9)
        run: |
          git clone --depth=1 https://github.com/ivanmeler/android_kernel_samsung_universal8895.git kernel-src

      - name: Inject Jockey 3 Driver into Kernel Source
        run: |
          # Copy driver files to sound/usb/
          cp jockey3.c ploytec_proto.c ploytec_codec.c ploytec_midi.c compat.h ploytec_proto.h ploytec_codec.h ploytec_midi.h kernel-src/sound/usb/
          
          # Link driver statically into sound/usb
          echo "obj-y += snd-reloop-jockey3.o" >> kernel-src/sound/usb/Makefile
          echo "snd-reloop-jockey3-y := jockey3.o ploytec_proto.o ploytec_codec.o ploytec_midi.o" >> kernel-src/sound/usb/Makefile

          # Fix Samsung vendor unused EXPORT_SYMBOL declarations
          sed -i 's/EXPORT_SYMBOL_GPL(maxdsm_dsm_read);//g' kernel-src/sound/soc/samsung/abox/abox_adaptation.c 2>/dev/null || true
          sed -i 's/EXPORT_SYMBOL_GPL(maxdsm_dsm_write);//g' kernel-src/sound/soc/samsung/abox/abox_adaptation.c 2>/dev/null || true
          sed -i 's/EXPORT_SYMBOL(check_bt_op);//g' kernel-src/drivers/bluetooth/bcm43xx.c 2>/dev/null || true

      - name: Compile Kernel
        run: |
          cd kernel-src
          
          # Force -fcommon into root Makefile and scripts/Makefile.host for GCC 10+
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -fcommon /' Makefile || true
          sed -i 's/HOSTCFLAGS   =/HOSTCFLAGS   = -fcommon /' Makefile || true
          sed -i 's/HOSTCFLAGS :=/HOSTCFLAGS := -fcommon /' Makefile || true
          sed -i 's/HOSTCFLAGS =/HOSTCFLAGS = -fcommon /' Makefile || true
          sed -i 's/HOSTLDFLAGS  :=/HOSTLDFLAGS  := -fcommon /' Makefile || true
          sed -i 's/HOSTLDFLAGS  =/HOSTLDFLAGS  = -fcommon /' Makefile || true
          sed -i 's/HOSTLDFLAGS :=/HOSTLDFLAGS := -fcommon /' Makefile || true
          sed -i 's/HOSTLDFLAGS =/HOSTLDFLAGS = -fcommon /' Makefile || true

          # Fix duplicate yylloc in dtc-lexer for GCC 10+
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/extern extern/extern/g' scripts/dtc/* 2>/dev/null || true
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang-11
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make exynos8895-dreamlte_defconfig
          make -j$(nproc)

      - name: Package with AnyKernel3 (TWRP Flashable Zip)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          
          # Configure AnyKernel3 for Galaxy S8 (dreamlte / universal8895)
          sed -i 's/device.name1=.*/device.name1=dreamlte/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=dream2lte/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-G950F/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=SM-G955F/' anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=auto;/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel.sh
          sed -i 's/RAMDISK_COMPRESSION=.*/RAMDISK_COMPRESSION=auto;/' anykernel.sh
          
          # Copy compiled Image and build combined DTB
          cp ../kernel-src/arch/arm64/boot/Image Image
          cat ../kernel-src/arch/arm64/boot/dts/exynos/exynos8895-dreamlte*.dtb > dtb 2>/dev/null || true
          
          # Create flashable zip
          zip -r9 ../S8-DJ-Kernel-dreamlte-AnyKernel3.zip * -x .git README.md *placeholder

      - name: Upload Flashable AnyKernel3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: S8-DJ-Kernel-dreamlte-AnyKernel3
          path: S8-DJ-Kernel-dreamlte-AnyKernel3.zip
