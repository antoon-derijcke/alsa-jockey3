name: Build Galaxy S8 DJ Kernel (dreamlte)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Jockey 3 Driver Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libncurses5-dev git ccache zip mkbootimg

      - name: Download Android Clang Toolchain (r383902)
        run: |
          mkdir -p clang-toolchain
          curl -sSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" | tar -xz -C clang-toolchain

      - name: Clone Galaxy S8 Kernel Source (Lineage 18.1 / 8d79a2d9)
        run: |
          git clone --depth=1 https://github.com/ivanmeler/android_kernel_samsung_universal8895.git kernel-src

      - name: Inject Jockey 3 Driver into Kernel Source
        run: |
          # Copy driver files to sound/usb/
          cp jockey3.c ploytec_proto.c ploytec_codec.c ploytec_midi.c compat.h ploytec_proto.h ploytec_codec.h ploytec_midi.h kernel-src/sound/usb/
          
          # Add to sound/usb/Makefile
          echo "obj-\$(CONFIG_SND_USB_JOCKEY3) += snd-reloop-jockey3.o" >> kernel-src/sound/usb/Makefile
          echo "snd-reloop-jockey3-y := jockey3.o ploytec_proto.o ploytec_codec.o ploytec_midi.o" >> kernel-src/sound/usb/Makefile
          
          # Add to sound/usb/Kconfig
          sed -i '/endmenu/i \
          config SND_USB_JOCKEY3\
          \ttristate "Reloop Jockey 3 Master Edition USB Audio/MIDI"\
          \tdepends on SND_USB\
          \tselect SND_PCM\
          \tselect SND_RAWMIDI\
          \tdefault y\
          \thelp\
          \t  Driver for Reloop Jockey 3 Master Edition DJ controllers.\
          ' kernel-src/sound/usb/Kconfig

      - name: Enable Touchscreen and Modules in Defconfig
        run: |
          DEFCONFIG=kernel-src/arch/arm64/configs/exynos8895-dreamlte_defconfig
          
          # Enable loadable modules
          sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y\nCONFIG_MODULE_UNLOAD=y/' $DEFCONFIG || true
          echo "CONFIG_MODULES=y" >> $DEFCONFIG
          echo "CONFIG_MODULE_UNLOAD=y" >> $DEFCONFIG
          
          # Enable Jockey 3 driver
          echo "CONFIG_SND_USB_JOCKEY3=y" >> $DEFCONFIG
          
          # Enable missing Touchscreen drivers
          echo "CONFIG_TOUCHSCREEN_SEC_TS_Y661=y" >> $DEFCONFIG
          echo "CONFIG_TOUCHSCREEN_SYNAPTICS_I2C_DSX2=y" >> $DEFCONFIG
          echo "CONFIG_TOUCHSCREEN_SYNAPTICS_I2C_RMI4=y" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          cd kernel-src
          
          # Fix classic GCC 10+ duplicate yylloc symbol error in older Linux 4.4 DTC
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l 2>/dev/null || true
          
          export PATH=$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export HOSTCFLAGS="-fcommon"
          export HOSTLDFLAGS="-fcommon"

          make exynos8895-dreamlte_defconfig
          make HOSTCFLAGS="-fcommon" HOSTLDFLAGS="-fcommon" -j$(nproc)

      - name: Package Boot Image Artifact
        run: |
          mkdir -p output
          cp kernel-src/arch/arm64/boot/Image output/Image
          cp kernel-src/arch/arm64/boot/dts/exynos/exynos8895-dreamlte*.dtb output/ 2>/dev/null || true
          cd output
          zip -r ../S8-DJ-Kernel-dreamlte.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S8-DJ-Kernel-dreamlte
          path: S8-DJ-Kernel-dreamlte.zip
