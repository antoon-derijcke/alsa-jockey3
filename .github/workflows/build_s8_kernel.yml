name: Build Galaxy S8 DJ Kernel (Official Android Toolchain)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libncurses5-dev git ccache zip python3 mkbootimg abootimg

      - name: Download Official Google Android Toolchains
        run: |
          mkdir -p clang
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902b.tar.gz" | tar -xz -C clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git gcc32
          chmod +x clang/bin/* gcc64/bin/* gcc32/bin/* 2>/dev/null || true

          # Create robust toolchain aliases in /usr/local/bin
          for f in /usr/bin/aarch64-linux-gnu-*; do
            sudo ln -sf "$f" "/usr/local/bin/$(basename "$f" | sed 's/aarch64-linux-gnu-/aarch64-linux-android-/')"
          done
          for f in /usr/bin/arm-linux-gnueabi-*; do
            sudo ln -sf "$f" "/usr/local/bin/$(basename "$f" | sed 's/arm-linux-gnueabi-/arm-linux-androideabi-/')"
          done

      - name: Clone Galaxy S8 Kernel Source (universal8895 lineage-18.1)
        run: |
          git clone --depth=1 -b lineage-18.1 https://github.com/exynos8895/android_kernel_samsung_universal8895.git kernel-src

      - name: Inject Reloop Jockey 3 Driver
        run: |
          cp jockey3.c ploytec_proto.c ploytec_codec.c ploytec_midi.c compat.h ploytec_proto.h ploytec_codec.h ploytec_midi.h kernel-src/sound/usb/
          echo "obj-y += snd-reloop-jockey3.o" >> kernel-src/sound/usb/Makefile
          echo "snd-reloop-jockey3-y := jockey3.o ploytec_proto.o ploytec_codec.o ploytec_midi.o" >> kernel-src/sound/usb/Makefile

          # Fix Samsung vendor unused EXPORT_SYMBOL declarations
          sed -i 's/EXPORT_SYMBOL_GPL(maxdsm_dsm_read);//g' kernel-src/sound/soc/samsung/abox/abox_adaptation.c 2>/dev/null || true
          sed -i 's/EXPORT_SYMBOL_GPL(maxdsm_dsm_write);//g' kernel-src/sound/soc/samsung/abox/abox_adaptation.c 2>/dev/null || true
          sed -i 's/EXPORT_SYMBOL(check_bt_op);//g' kernel-src/drivers/bluetooth/bcm43xx.c 2>/dev/null || true

      - name: Compile Kernel with Android Toolchain
        run: |
          cd kernel-src
          
          # Force -fcommon for host tools (dtc / yylloc)
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -fcommon /' Makefile || true
          sed -i 's/HOSTCFLAGS   =/HOSTCFLAGS   = -fcommon /' Makefile || true
          sed -i 's/HOSTLDFLAGS  :=/HOSTLDFLAGS  := -fcommon /' Makefile || true
          sed -i 's/HOSTLDFLAGS  =/HOSTLDFLAGS  = -fcommon /' Makefile || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/extern extern/extern/g' scripts/dtc/* 2>/dev/null || true

          # Fix Clang VDSO macro positional arguments comma syntax
          sed -i 's/clock_gettime_return, shift=1/clock_gettime_return shift=1/g' arch/arm64/kernel/vdso/gettimeofday.S 2>/dev/null || true
          sed -i 's/clock_gettime_return,/clock_gettime_return/g' arch/arm64/kernel/vdso/gettimeofday.S 2>/dev/null || true
          sed -i 's/gettimeofday_return,/gettimeofday_return/g' arch/arm64/kernel/vdso/gettimeofday.S 2>/dev/null || true

          # Tell Clang VDSO linker where the AArch64 cross-linker is
          sed -i 's/$(CC) -nostdlib/$(CC) -B$(CROSS_COMPILE) -nostdlib/g' arch/arm64/kernel/vdso/Makefile 2>/dev/null || true

          # Clang bcmp and stpcpy compatibility shims
          printf "\n#undef bcmp\nint bcmp(const void *a, const void *b, size_t len) { return memcmp(a, b, len); }\nEXPORT_SYMBOL(bcmp);\n" >> lib/string.c
          printf "\n#undef stpcpy\nchar *stpcpy(char *dest, const char *src) { while ((*dest++ = *src++)); return dest - 1; }\nEXPORT_SYMBOL(stpcpy);\n" >> lib/string.c
          sed -i 's/KBUILD_CFLAGS   :=/KBUILD_CFLAGS   := -fno-builtin-bcmp -fno-builtin-stpcpy /' Makefile || true
          sed -i 's/KBUILD_CFLAGS   =/KBUILD_CFLAGS   = -fno-builtin-bcmp -fno-builtin-stpcpy /' Makefile || true

          export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make exynos8895-dreamlte_defconfig CC=clang
          make -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package Boot Image with Stock Offsets & SEAndroid Signature
        run: |
          python3 scripts/package_boot.py

          # Package TWRP flashable zip with AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          sed -i 's/device.name1=.*/device.name1=dreamlte/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=dream2lte/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-G950F/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=SM-G955F/' anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=auto;/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel.sh
          sed -i 's/RAMDISK_COMPRESSION=.*/RAMDISK_COMPRESSION=auto;/' anykernel.sh
          
          cp ../kernel-src/arch/arm64/boot/Image Image
          cp ../stock/BOOT.img-dt dtb
          zip -r9 ../S8-DJ-Kernel-Official-TWRP.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Boot Image & TWRP Package
        uses: actions/upload-artifact@v4
        with:
          name: S8-DJ-Kernel-Official
          path: |
            S8-DJ-boot.img
            S8-DJ-Kernel-Official-TWRP.zip
