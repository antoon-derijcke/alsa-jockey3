name: Build Jockey 3 Audio Bridge (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install ARM64 Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Compile Standalone Static ARM64 Bridge
        run: |
          aarch64-linux-gnu-gcc -O3 -static jockey3_bridge.c -o jockey3_bridge -lpthread
          ls -la jockey3_bridge

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: jockey3_bridge
          path: jockey3_bridge
